<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark navy background circle -->
  <circle cx="50" cy="50" r="50" fill="#090b12"/>

  <!-- Outer brain circle outline -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#1a3a6e" stroke-width="1.5"/>

  <!-- Brain hemisphere divider (vertical) -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#1565a8" stroke-width="1.2"/>

  <!-- Left hemisphere top curve -->
  <path d="M50 12 C35 12, 18 22, 14 36 C10 50, 16 66, 30 74 C38 79, 50 80, 50 80" fill="none" stroke="#1e88e5" stroke-width="2"/>
  <!-- Right hemisphere top curve -->
  <path d="M50 12 C65 12, 82 22, 86 36 C90 50, 84 66, 70 74 C62 79, 50 80, 50 80" fill="none" stroke="#1e88e5" stroke-width="2"/>

  <!-- Bottom brain curves (folds) -->
  <path d="M30 74 C34 82, 44 86, 50 86" fill="none" stroke="#1e88e5" stroke-width="1.5"/>
  <path d="M70 74 C66 82, 56 86, 50 86" fill="none" stroke="#1e88e5" stroke-width="1.5"/>

  <!-- Left hemisphere circuit lines -->
  <line x1="50" y1="50" x2="26" y2="38" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="26" y1="38" x2="18" y2="38" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="50" y1="50" x2="22" y2="50" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="50" y1="50" x2="28" y2="62" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="28" y1="62" x2="20" y2="62" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="26" y1="38" x2="26" y2="28" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="26" y1="28" x2="18" y2="28" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="22" y1="50" x2="22" y2="42" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="28" y1="62" x2="28" y2="70" stroke="#29b6f6" stroke-width="1.2"/>

  <!-- Right hemisphere circuit lines -->
  <line x1="50" y1="50" x2="74" y2="38" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="74" y1="38" x2="82" y2="38" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="50" y1="50" x2="78" y2="50" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="50" y1="50" x2="72" y2="62" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="72" y1="62" x2="80" y2="62" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="74" y1="38" x2="74" y2="28" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="74" y1="28" x2="82" y2="28" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="78" y1="50" x2="78" y2="42" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="72" y1="62" x2="72" y2="70" stroke="#29b6f6" stroke-width="1.2"/>

  <!-- Vertical lines from center -->
  <line x1="50" y1="50" x2="50" y2="22" stroke="#29b6f6" stroke-width="1.2"/>
  <line x1="50" y1="50" x2="50" y2="78" stroke="#29b6f6" stroke-width="1.2"/>

  <!-- Circuit endpoint nodes - left -->
  <circle cx="18" cy="38" r="2.5" fill="#29b6f6"/>
  <circle cx="22" cy="50" r="2.5" fill="#29b6f6"/>
  <circle cx="20" cy="62" r="2.5" fill="#29b6f6"/>
  <circle cx="18" cy="28" r="2.5" fill="#29b6f6"/>
  <circle cx="22" cy="42" r="2.5" fill="#29b6f6"/>
  <circle cx="28" cy="70" r="2.5" fill="#29b6f6"/>
  <circle cx="26" cy="38" r="2" fill="#29b6f6"/>
  <circle cx="28" cy="62" r="2" fill="#29b6f6"/>

  <!-- Circuit endpoint nodes - right -->
  <circle cx="82" cy="38" r="2.5" fill="#29b6f6"/>
  <circle cx="78" cy="50" r="2.5" fill="#29b6f6"/>
  <circle cx="80" cy="62" r="2.5" fill="#29b6f6"/>
  <circle cx="82" cy="28" r="2.5" fill="#29b6f6"/>
  <circle cx="78" cy="42" r="2.5" fill="#29b6f6"/>
  <circle cx="72" cy="70" r="2.5" fill="#29b6f6"/>
  <circle cx="74" cy="38" r="2" fill="#29b6f6"/>
  <circle cx="72" cy="62" r="2" fill="#29b6f6"/>

  <!-- Top and bottom endpoint nodes -->
  <circle cx="50" cy="22" r="2.5" fill="#29b6f6"/>
  <circle cx="50" cy="78" r="2.5" fill="#29b6f6"/>

  <!-- Center glow (outer) -->
  <circle cx="50" cy="50" r="9" fill="#1565a8" opacity="0.6"/>
  <!-- Center glow (mid) -->
  <circle cx="50" cy="50" r="6" fill="#42a5f5" opacity="0.8"/>
  <!-- Center bright core -->
  <circle cx="50" cy="50" r="4" fill="white"/>
  <!-- Center inner glow -->
  <circle cx="50" cy="50" r="2.5" fill="white" opacity="1"/>
</svg>
